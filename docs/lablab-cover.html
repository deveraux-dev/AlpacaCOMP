<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>13forge Lablab Cover</title>
  <style>
    :root {
      --bg: #050706;
      --panel: #101411;
      --panel-2: #171216;
      --grid: rgba(77, 91, 82, 0.33);
      --ink: #f4f7f2;
      --muted: #aab3aa;
      --green: #43c878;
      --red: #ff4567;
      --line: rgba(244, 247, 242, 0.18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1200px;
      height: 675px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .cover {
      position: relative;
      width: 1200px;
      height: 675px;
      padding: 58px 72px;
      background:
        linear-gradient(90deg, rgba(67, 200, 120, 0.13), transparent 28%, transparent 70%, rgba(255, 69, 103, 0.12)),
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        radial-gradient(circle at 50% 50%, rgba(67, 200, 120, 0.12), transparent 34%),
        var(--bg);
      background-size: auto, 36px 36px, 36px 36px, auto, auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      height: 68px;
    }

    .brand img {
      width: 286px;
      height: auto;
      display: block;
    }

    .tag {
      border: 1px solid rgba(67, 200, 120, 0.55);
      color: var(--green);
      padding: 8px 13px;
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(67, 200, 120, 0.08);
    }

    h1 {
      width: 760px;
      margin: 62px 0 0;
      font-size: 86px;
      line-height: 0.94;
      font-weight: 900;
      letter-spacing: 0;
    }

    .subhead {
      width: 700px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 32px;
      line-height: 1.18;
      font-weight: 650;
    }

    .proof-strip {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 54px;
      display: grid;
      grid-template-columns: 1fr 84px 1fr 84px 1fr;
      align-items: stretch;
      gap: 0;
    }

    .node {
      min-height: 112px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    .node span {
      color: var(--muted);
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .node strong {
      margin-top: 8px;
      font-size: 34px;
      line-height: 1;
      font-weight: 900;
    }

    .safe strong { color: var(--green); }
    .blocked {
      border-color: rgba(255, 69, 103, 0.72);
      background: color-mix(in srgb, var(--panel-2) 94%, transparent);
    }
    .blocked strong { color: var(--red); }

    .arrow {
      display: grid;
      place-items: center;
      color: var(--green);
      font-size: 54px;
      font-weight: 900;
    }

    .badge {
      position: absolute;
      right: 72px;
      top: 156px;
      width: 282px;
      height: 282px;
      border: 2px solid rgba(255, 69, 103, 0.78);
      background:
        linear-gradient(135deg, rgba(255, 69, 103, 0.13), rgba(67, 200, 120, 0.07)),
        rgba(10, 11, 12, 0.86);
      display: grid;
      place-items: center;
      transform: rotate(-2deg);
      box-shadow: 0 24px 80px rgba(255, 69, 103, 0.14);
    }

    .badge div {
      text-align: center;
      transform: rotate(2deg);
    }

    .badge strong {
      display: block;
      color: var(--red);
      font-size: 52px;
      font-weight: 950;
      line-height: 1;
    }

    .badge span {
      display: block;
      margin-top: 12px;
      color: var(--ink);
      font-size: 24px;
      font-weight: 850;
    }

    .badge small {
      display: block;
      margin-top: 20px;
      color: var(--muted);
      font-size: 20px;
      font-weight: 850;
    }
  </style>
</head>
<body>
  <main class="cover" aria-label="13forge hackathon cover">
    <div class="brand">
      <img src="../demo-portal/assets/brand/13forge-logo-dark.svg" alt="13forge">
      <div class="tag">Alpaca AI trading</div>
    </div>

    <h1>AI can suggest. Code decides.</h1>
    <p class="subhead">A proof-first safety layer that stops risky options trades before Alpaca sees the order.</p>

    <div class="badge">
      <div>
        <strong>REFUSED</strong>
        <span>Broker not reached</span>
        <small>$2,525 &gt; $2,000 limit</small>
      </div>
    </div>

    <section class="proof-strip" aria-label="13forge proof flow">
      <div class="node">
        <span>AI idea</span>
        <strong>Suggests</strong>
      </div>
      <div class="arrow" aria-hidden="true">&gt;</div>
      <div class="node safe">
        <span>Rust gates</span>
        <strong>Check</strong>
      </div>
      <div class="arrow" aria-hidden="true">x</div>
      <div class="node blocked">
        <span>Alpaca</span>
        <strong>Blocked</strong>
      </div>
    </section>
  </main>
</body>
</html>
